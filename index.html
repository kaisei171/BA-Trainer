<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Black Apron Study | 個人学習</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17352b;background:#f5f5f0}*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:auto;padding:22px 16px 80px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.tag{font-size:12px;color:#60756b;letter-spacing:.12em}h1{font-size:26px;margin:4px 0}h2{font-size:19px;margin:0 0 12px}.card{background:white;border:1px solid #e0e7df;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #163a2610}.muted{color:#697970;font-size:13px}.pill{display:inline-block;border-radius:20px;background:#e9f2e9;padding:6px 10px;font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}button,select,input{font:inherit}button{background:#176c4d;border:1px solid #176c4d;color:white;border-radius:12px;padding:13px 16px;cursor:pointer;font-weight:650}button.secondary{background:white;color:#176c4d}button.warn{background:white;color:#9b5132;border-color:#e8c8b6}button:disabled{opacity:.4;cursor:default}select,input{width:100%;padding:12px;border:1px solid #ccd9d0;border-radius:10px;background:white;margin:6px 0 14px}.question{font-size:19px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}.answer{white-space:pre-wrap;line-height:1.7;background:#edf6ed;border-radius:12px;padding:15px;overflow-wrap:anywhere}.hidden{display:none}.progress{height:8px;background:#e5e9e4;border-radius:10px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#176c4d}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#f2f6f1;border-radius:12px;padding:12px 5px}.stat b{font-size:23px}.small{font-size:12px}.footer{margin-top:22px;color:#7a857d;font-size:12px}label{font-size:13px;font-weight:650}.checkbox{display:flex;align-items:center;gap:8px;margin:10px 0}.checkbox input{width:auto;margin:0}#notice{font-size:13px;color:#a04d2b}</style></head><body><div class="wrap"><header><div><div class="tag">PRIVATE COFFEE STUDY</div><h1>Black Apron Study</h1></div><span style="font-size:32px">☕</span></header><div class="card"><div class="stats"><div class="stat"><b id="total">0</b><div class="small">問題候補</div></div><div class="stat"><b id="done">0</b><div class="small">学習済み</div></div><div class="stat"><b id="missed">0</b><div class="small">要復習</div></div></div><div class="progress"><div id="progress" style="width:0%"></div></div><div class="muted">この端末のブラウザに学習記録を保存します。</div></div><div class="card"><h2>出題設定</h2><label for="year">年度</label><select id="year"><option value="">FY26・FY27 両方</option><option value="FY26">FY26</option><option value="FY27">FY27</option></select><label for="section">分野</label><select id="section"></select><label for="mode">出題方法</label><select id="mode"><option value="order">教材順</option><option value="random">ランダム</option><option value="wrong">要復習のみ</option><option value="unseen">未学習のみ</option></select><label class="checkbox"><input type="checkbox" id="skip" checked> 自動抽出した未校正の問題を含める</label><button id="start" style="width:100%">学習を開始</button><p id="notice">※FY26・FY27の読み取れた問題のみ収録しています。全問未校正です。誤対応や不完全な問題が含まれます。</p></div><div class="card hidden" id="study"><div class="row" style="align-items:center"><span id="meta" class="pill"></span><span id="counter" class="muted" style="text-align:right"></span></div><div class="progress"><div id="qprogress" style="width:0%"></div></div><div class="question" id="question"></div><div id="answer" class="answer hidden"></div><div class="row" style="margin-top:18px"><button id="reveal">答えを見る</button></div><div class="row hidden" id="grade" style="margin-top:10px"><button id="correct">覚えていた ✓</button><button class="warn" id="wrong">覚えていない ↺</button></div><div class="row" style="margin-top:10px"><button class="secondary" id="prev">前の問題</button><button class="secondary" id="next">次の問題</button></div><div class="row" style="margin-top:10px"><button class="warn" id="flag">⚑ この問題を要確認にする</button><button class="secondary" id="close">設定に戻る</button></div><p id="flagmsg" class="muted"></p></div><div class="card"><h2>学習データ</h2><div class="row"><button class="secondary" id="export">学習記録を保存</button><button class="secondary" id="exportFlags">要確認リストを保存</button></div><div class="row" style="margin-top:10px"><button class="warn" id="reset">学習記録をリセット</button></div></div><div class="footer">個人学習専用。教材の著作権・機密性に注意し、このファイルを公開サイトにアップロードしないでください。</div></div><script src="questions.js"></script><script>
const all=window.QUESTIONS||[];const key='blackApronFY26FY27-v1';let history={},flags={},queue=[],idx=0;try{history=JSON.parse(localStorage.getItem(key)||'{}');flags=JSON.parse(localStorage.getItem(key+'-flags')||'{}')}catch{}const el=id=>document.getElementById(id);const save=()=>{localStorage.setItem(key,JSON.stringify(history));localStorage.setItem(key+'-flags',JSON.stringify(flags));stats()};function stats(){el('total').textContent=all.length;let done=all.filter(x=>history[x.id]).length;el('done').textContent=done;el('missed').textContent=all.filter(x=>history[x.id]==='wrong').length;el('progress').style.width=(all.length?100*done/all.length:0)+'%'}let sections=[...new Set(all.map(x=>x.section||'未分類'))];el('section').innerHTML='<option value="">すべての分野</option>'+sections.map(s=>'<option></option>').join('');[...el('section').options].slice(1).forEach((o,i)=>{o.value=sections[i];o.textContent=sections[i]});function show(){if(!queue.length)return;let q=queue[idx];el('study').classList.remove('hidden');el('meta').textContent=`${q.year} ・ ${q.section} ・ PDF ${q.pdf_page}ページ`;el('counter').textContent=`${idx+1} / ${queue.length}`;el('qprogress').style.width=((idx+1)/queue.length*100)+'%';el('question').textContent=q.question_original||'(問題文なし)';el('answer').textContent='教材の解答：\n'+(q.answer_original||'（抽出できませんでした）');el('answer').classList.add('hidden');el('grade').classList.add('hidden');el('reveal').classList.remove('hidden');el('prev').disabled=idx===0;el('next').disabled=idx===queue.length-1;el('flagmsg').textContent=flags[q.id]?'⚑ 要確認として記録済み':'';el('flag').textContent=flags[q.id]?'⚑ 要確認を解除':'⚑ この問題を要確認にする';el('study').scrollIntoView({behavior:'smooth',block:'start'})}el('start').onclick=()=>{let s=el('section').value,m=el('mode').value;queue=all.filter(q=>(!el('year').value||q.year===el('year').value)&&(!s||q.section===s)&& (el('skip').checked||q.review_status==='目視確認済み') &&(m!=='wrong'||history[q.id]==='wrong')&&(m!=='unseen'||!history[q.id]));if(m==='random')queue.sort(()=>Math.random()-.5);if(!queue.length){alert('条件に合う問題がありません。');return}idx=0;show()};el('reveal').onclick=()=>{el('answer').classList.remove('hidden');el('grade').classList.remove('hidden');el('reveal').classList.add('hidden')};function grade(v){history[queue[idx].id]=v;save();if(idx<queue.length-1){idx++;show()}else{alert('最後の問題です。学習記録を保存しました。')}}el('correct').onclick=()=>grade('correct');el('wrong').onclick=()=>grade('wrong');el('prev').onclick=()=>{if(idx>0){idx--;show()}};el('next').onclick=()=>{if(idx<queue.length-1){idx++;show()}};el('close').onclick=()=>{el('study').classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})};el('flag').onclick=()=>{let id=queue[idx].id;if(flags[id])delete flags[id];else flags[id]=true;save();show()};function download(name,data){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}el('export').onclick=()=>download('black_apron_study_progress.json',history);el('exportFlags').onclick=()=>download('black_apron_review_flags.json',all.filter(q=>flags[q.id]).map(q=>({id:q.id,section:q.section,pdf_page:q.pdf_page,question_original:q.question_original,answer_original:q.answer_original})));el('reset').onclick=()=>{if(confirm('学習記録をすべて削除しますか？')){history={};save()}};stats();
</script></body></html>
